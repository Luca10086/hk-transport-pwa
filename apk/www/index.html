<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F1F1F">
<title>森友出行 · WP8 概念版</title>
<link rel="stylesheet" href="css/wp8-strict.css">
</head>
<body>

<!-- ================= 顶栏：Pivot 大标题 ================= -->
<header class="topbar">
  <h1 class="pivot-title" id="pivotTitle">森友出行</h1>
  <div class="topbar-actions">
    <button class="topbar-search" onclick="goPane('home');setTimeout(function(){goPanoPanel(1);var i=document.getElementById('searchInput');if(i)i.focus();},400)" aria-label="搜尋路線">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    </button>
    <button class="topbar-refresh" id="topbarRefresh" onclick="refreshAll()" aria-label="重新整理">↻</button>
  </div>
</header>

<!-- ================= 加载进度条 ================= -->
<div class="progressbar" id="progressbar" hidden></div>

<!-- ================= 下拉刷新提示 ================= -->
<div class="ptr" id="ptr">放開以重新整理</div>

<!-- ================= 磁貼長按選單 ================= -->
<div class="tile-menu" id="tileMenu" hidden></div>

<!-- ================= Pivot（横滑窗格） ================= -->
<main class="pivot" id="pivot">

  <!-- 首页：全景 + 磁贴 + 搜索 + 天气 + K75P -->
  <section class="pane" data-pane="home">
    <!-- 首页全景 Panorama -->
    <div class="pano">
      <div class="pano-bg" id="panoBg" aria-hidden="true"></div>
      <div class="pano-track" id="panoTrack">

        <!-- 面板 1：磁贴（WP8 官方色板純色牆：小=1/4、中=1/2、寬=全寬） -->
        <div class="pano-panel">
          <div class="tiles">
            <button class="tile tile-cobalt" data-tile="favs" onclick="goPane('favs')">我的收藏</button>
            <button class="tile tile-magenta" data-tile="sushi" onclick="goPane('sushi')">壽司郎</button>
            <button class="tile tile-wide tile-flip tile-teal" id="tileWeather" data-tile="weather" onclick="refreshWeather()">
              <span class="tile-face"><span>天氣</span><b id="tileWeatherV">--°</b><span class="tile-sub" id="tileWeatherSub">載入中</span></span>
              <span class="tile-face tile-face-back" id="tileWeatherD">明天 --</span>
            </button>
            <button class="tile tile-wide tile-cobalt" id="tileK75P" data-tile="k75p" onclick="goBusMap()">
              <span>K75P · 天瑞</span>
              <b id="k75pTileV">--</b>
              <span class="tile-sub" id="k75pTileSub">載入中</span>
            </button>
            <button class="tile tile-wide tile-cyan" id="tileFav" data-tile="favlive" onclick="goPane('favs')">
              <span>收藏 ①</span>
              <b id="favTileV">—</b>
              <span class="tile-sub" id="favTileS">暫無收藏</span>
            </button>
            <button class="tile tile-cyan" data-tile="map" onclick="goPane('map')">路線圖</button>
            <button class="tile tile-teal" data-tile="settings" onclick="goPane('settings')">設定</button>
          </div>
        </div>

        <!-- 面板 2：搜索 + 结果 -->
        <div class="pano-panel">
          <div class="search-block">
            <input id="searchInput" class="metro-input" placeholder="輸入巴士路線、站名或港鐵車站" aria-label="搜尋"
                   onkeydown="if(event.key==='Enter') doSearch()">
            <div class="chips" id="chips">
              <button class="chip active" data-tp="bus" onclick="setTransport('bus', this)">公交</button>
              <button class="chip" data-tp="mtrbus" onclick="setTransport('mtrbus', this)">港鐵巴士</button>
              <button class="chip" data-tp="mtr" onclick="setTransport('mtr', this)">港鐵</button>
              <button class="chip" data-tp="lrt" onclick="setTransport('lrt', this)">輕鐵</button>
            </div>
            <button class="search-btn" onclick="doSearch()">搜尋</button>
          </div>
          <div id="results" class="flat-list"></div>
        </div>

        <!-- 面板 3：天气 + K75P -->
        <div class="pano-panel">
          <h3 class="pane-title">天氣</h3>
          <div id="warningBar" class="warning-bar" hidden></div>
          <div id="weather" class="weather-bar">載入中…</div>
          <h3 class="pane-title">k75p 全線實時</h3>
          <div id="k75p" class="flat-list"></div>
        </div>
      </div>
      <div class="pano-hint" id="panoHint"><i class="on"></i><i></i><i></i></div>
    </div>
  </section>

  <!-- 收藏 -->
  <section class="pane" data-pane="favs">
    <div class="pane-inner">
      <h2 class="pane-title">收藏</h2>
      <div id="favs" class="flat-list"><div class="metro-empty">暫無收藏，在搜尋結果按 ☆ 加入</div></div>
    </div>
  </section>

  <!-- 寿司郎 -->
  <section class="pane" data-pane="sushi">
    <div class="pane-inner">
      <h2 class="pane-title">壽司郎</h2>
      <div id="sushi" class="flat-list"><div class="metro-empty">載入中…</div></div>
    </div>
  </section>

  <!-- 路线图 -->
  <section class="pane" data-pane="map">
    <div class="pane-inner">
      <h2 class="pane-title">路線圖</h2>
      <div class="map-lines" id="mapLines"></div>
      <div class="map-body" id="mapBody"></div>
      <div id="busMap" class="bus-map" hidden></div>
    </div>
  </section>

  <!-- 设定 -->
  <section class="pane" data-pane="settings">
    <div class="pane-inner">
      <h2 class="pane-title">設定</h2>
      <div class="settings-list">
        <div class="setting-row"><span class="label">主題</span>
          <div class="seg" id="themeSeg">
            <button data-th="dark" onclick="setTheme('dark')">深色</button>
            <button data-th="light" onclick="setTheme('light')">淺色</button>
          </div>
        </div>
        <div class="setting-row"><span class="label">強調色</span>
          <div class="seg" id="accentSeg">
            <button data-ac="#8B5CF6" style="color:#8B5CF6" onclick="setAccent('#8B5CF6')">紫</button>
            <button data-ac="#6D28D9" style="color:#8B5CF6" onclick="setAccent('#6D28D9')">深紫</button>
            <button data-ac="#7C3AED" style="color:#8B5CF6" onclick="setAccent('#7C3AED')">紫羅蘭</button>
            <button data-ac="#A78BFA" style="color:#8B5CF6" onclick="setAccent('#A78BFA')">淡紫</button>
          </div>
        </div>
        <div class="setting-row"><span class="label">介面風格</span>
          <div class="seg" id="uiSeg">
            <button data-ui="wp7" onclick="setUIMode('wp7')">WP7</button>
            <button data-ui="wp8" onclick="setUIMode('wp8')">WP8</button>
          </div>
        </div>
        <div class="setting-row"><span class="label">高對比</span>
          <div class="seg" id="contrastSeg">
            <button data-ct="1" onclick="setContrast(1)">開</button>
            <button data-ct="0" onclick="setContrast(0)">關</button>
          </div>
        </div>
        <div class="setting-row"><span class="label">自動重新整理</span>
          <div class="seg" id="refreshSeg">
            <button data-rv="15" onclick="setRefresh(15)">15s</button>
            <button data-rv="30" onclick="setRefresh(30)">30s</button>
            <button data-rv="60" onclick="setRefresh(60)">60s</button>
            <button data-rv="0" onclick="setRefresh(0)">關</button>
          </div>
        </div>
        <div class="setting-row"><span class="label">資料來源</span><span class="val">data.gov.hk</span></div>
        <div class="setting-row"><span class="label">版本</span><span class="val" id="appVersion">Beta 0.1</span></div>
      </div>
    </div>
  </section>
</main>

<!-- ================= App Bar ================= -->
<nav class="appbar">
  <button class="ab-btn active" data-pane="home" onclick="goPane('home')" aria-label="首頁">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5V21a1 1 0 01-1 1h-5.5v-6h-5v6H4a1 1 0 01-1-1z"/></svg>
  </button>
  <button class="ab-btn" data-pane="favs" onclick="goPane('favs')" aria-label="收藏">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
  </button>
  <button class="ab-btn" data-pane="sushi" onclick="goPane('sushi')" aria-label="壽司郎">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 2.5L6.7 21M14.8 2.5l2.5 18.5M5 17.5c0 1.93 3.13 3.5 7 3.5s7-1.57 7-3.5S16.13 14 12 14s-7 1.57-7 3.5z"/></svg>
  </button>
  <button class="ab-btn" data-pane="settings" onclick="goPane('settings')" aria-label="設定">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.3"/><path d="M19.4 13.5a7.9 7.9 0 000-3l2-1.5-2-3.4-2.3.9a7.9 7.9 0 00-2.6-1.5L14.2 2h-4l-.3 2.5a7.9 7.9 0 00-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.9 7.9 0 000 3l-2 1.5 2 3.4 2.3-.9a7.9 7.9 0 002.6 1.5l.3 2.5h4l.3-2.5a7.9 7.9 0 002.6-1.5l2.3.9 2-3.4-2-1.5z"/></svg>
  </button>
  <button class="ab-more" onclick="toggleMore()" aria-label="更多選項">⋯</button>
  <div class="more-menu" id="moreMenu" hidden>
    <button onclick="moreAction('refresh')">重新整理</button>
    <button onclick="moreAction('fav')">收藏首條結果</button>
    <button onclick="moreAction('map')">路線圖</button>
  </div>
</nav>

<!-- ================= 路線詳情（點擊路線後右側滑入） ================= -->
<div class="detail-sheet" id="detailSheet" hidden>
  <header class="detail-bar">
    <button class="back-btn" onclick="closeRouteDetail()" aria-label="返回">←</button>
    <div class="detail-title" id="detailTitle">路線詳情</div>
  </header>
  <div class="detail-body" id="detailBody"></div>
</div>

<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/version.js"></script>
<script src="js/wp8-concept.js"></script>
</body>
</html>
