<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>森友出行手册 🍃</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5fae82">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="森友出行">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Roboto:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  --bg-top: #e6f4e8;
  --bg-mid: #fdf6e3;
  --bg-bottom: #f9ead6;
  --text: #4a3f35;
  --text-dark: #5a4632;
  --primary: #5fae82;
  --primary-light: #8fd3a8;
  --primary-dark: #3f8a63;
  --card-bg: #fffdf5;
  --card-bg2: #fdf3e0;
  --card-border: #e8d5b5;
  --card-shadow: #d9c4a0;
  --card-bg-soft: #fffef9;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Nunito', 'ZCOOL KuaiLe', 'Baloo 2', -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
  color: var(--text); line-height: 1.5;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* ===== Background Decorations (leaves / flowers / stars) ===== */
.bg-decor { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-decor .deco { position: absolute; opacity: 0.28; font-size: 2.2rem; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.08)); }
.deco-1 { top: 6%; left: 4%; transform: rotate(-15deg); }
.deco-2 { top: 14%; right: 5%; transform: rotate(12deg); }
.deco-3 { top: 42%; left: 2%; transform: rotate(8deg); }
.deco-4 { top: 68%; right: 3%; transform: rotate(-10deg); }
.deco-5 { bottom: 8%; left: 6%; transform: rotate(20deg); }
.deco-6 { bottom: 18%; right: 7%; transform: rotate(-18deg); }
.deco-7 { top: 30%; left: 8%; transform: rotate(5deg); }
.deco-8 { top: 55%; right: 5%; transform: rotate(-8deg); }
.deco-9 { bottom: 32%; left: 3%; transform: rotate(15deg); }
.deco-10 { top: 80%; right: 12%; transform: rotate(-12deg); }

/* ===== Top Navbar (wooden sign style) ===== */
.navbar {
  background: linear-gradient(180deg, var(--primary-light) 0%, var(--primary) 100%);
  color: #fff; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  border-bottom: 5px solid var(--primary-dark);
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}
.navbar h1 {
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif;
  font-size: 1.35rem; font-weight: 800; letter-spacing: 0.5px;
  text-shadow: 0 2px 0 rgba(0,0,0,0.15);
}
.navbar .refresh-btn {
  background: linear-gradient(180deg, #ffd166, #f4a261);
  border: none; color: var(--text-dark);
  padding: 8px 18px; border-radius: 14px; cursor: pointer; font-size: 0.9rem;
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight: 700;
  box-shadow: 0 4px 0 #d98a3d, 0 5px 10px rgba(0,0,0,0.15);
  transition: transform 0.1s, box-shadow 0.1s;
}
.navbar .refresh-btn:hover { filter: brightness(1.05); }
.navbar .refresh-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d98a3d; }
.navbar .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #d98a3d; }
.navbar-actions { display: flex; align-items: center; gap: 10px; }
.navbar .skin-btn {
  background: linear-gradient(180deg, #fffdf5, #f4e6cf);
  border: 2px solid var(--card-border); color: var(--text-dark);
  padding: 7px 12px; border-radius: 14px; cursor: pointer; font-size: 1rem;
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight: 700;
  box-shadow: 0 3px 0 var(--card-shadow), 0 5px 10px rgba(0,0,0,0.12);
  transition: transform 0.1s, box-shadow 0.1s;
}
.navbar .skin-btn:hover { filter: brightness(1.05); }
.navbar .skin-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--card-shadow); }

/* ===== Main Container ===== */
.container { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; position: relative; z-index: 1; }

/* ===== Search Section (wooden board) ===== */
.search-section {
  background: linear-gradient(180deg, var(--card-bg), var(--card-bg2));
  border: 3px solid var(--card-border);
  border-radius: 24px; padding: 22px; margin-bottom: 22px;
  box-shadow: 0 5px 0 var(--card-shadow), 0 10px 20px rgba(0,0,0,0.08);
}
.search-row {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.search-input {
  flex: 1; min-width: 200px; padding: 13px 18px;
  border: 3px solid #e0d3b8; border-radius: 16px; font-size: 1rem;
  font-family: 'Nunito', 'ZCOOL KuaiLe', sans-serif;
  background: var(--card-bg-soft); color: var(--text);
  outline: none; transition: border 0.2s, box-shadow 0.2s;
}
.search-input:focus { border-color: #7ec8a0; box-shadow: 0 0 0 4px rgba(126,200,160,0.25); }
.search-input::placeholder { color: #b8a98f; }
.transport-toggle {
  display: flex; gap: 6px; background: #f0e6d6; border-radius: 18px; padding: 4px;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
}
.transport-toggle button {
  padding: 9px 18px; border: none; background: transparent;
  border-radius: 14px; cursor: pointer; font-size: 0.9rem; color: #6b5b45;
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight: 600;
  transition: all 0.2s; white-space: nowrap;
}
.transport-toggle button.active {
  background: linear-gradient(180deg, var(--primary-light), var(--primary)); color: #fff;
  box-shadow: 0 3px 0 var(--primary-dark), 0 3px 6px rgba(0,0,0,0.12);
  text-shadow: 0 1px 0 rgba(0,0,0,0.12);
}
.search-btn {
  padding: 13px 26px; background: linear-gradient(180deg, #ffd166, #f4a261); color: var(--text-dark);
  border: none; border-radius: 16px; cursor: pointer; font-size: 1rem;
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight: 800;
  box-shadow: 0 5px 0 #d98a3d, 0 6px 12px rgba(0,0,0,0.12);
  transition: transform 0.1s, box-shadow 0.1s, filter 0.2s; white-space: nowrap;
}
.search-btn:hover { filter: brightness(1.05); }
.search-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #d98a3d; }
.search-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 #d98a3d; }

/* ===== Section Title (wooden sign) ===== */
.section-title {
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif;
  font-size: 1.2rem; font-weight: 800; color: var(--text-dark);
  background: linear-gradient(180deg, #eccfa4, #d9b380);
  border: 3px solid #b98a5a;
  border-radius: 18px;
  padding: 8px 20px;
  display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 4px 0 #a97a4a, 0 6px 12px rgba(0,0,0,0.1);
  margin-bottom: 16px;
  text-shadow: 0 1px 0 rgba(255,255,255,0.35);
}
.section-title .badge {
  font-size: 0.8rem; background: #fff8e7; color: #8a6a3a;
  padding: 2px 12px; border-radius: 12px; font-weight: 700;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
}

/* ===== Favorites Area ===== */
.favorites-section {
  background: linear-gradient(180deg, var(--card-bg), var(--card-bg2));
  border: 3px solid var(--card-border);
  border-radius: 24px; padding: 22px; margin-bottom: 22px;
  box-shadow: 0 5px 0 var(--card-shadow), 0 10px 20px rgba(0,0,0,0.08); min-height: 80px;
}
.empty-hint {
  text-align: center; color: #a08d6f; padding: 28px 0; font-size: 0.95rem;
  font-family: 'ZCOOL KuaiLe', 'Nunito', sans-serif;
}
.empty-hint .icon { font-size: 2.4rem; display: block; margin-bottom: 10px; opacity: 0.6; }
.card-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

/* ===== Search Results ===== */
.results-section {
  background: linear-gradient(180deg, var(--card-bg), var(--card-bg2));
  border: 3px solid var(--card-border);
  border-radius: 24px; padding: 22px; margin-bottom: 22px;
  box-shadow: 0 5px 0 var(--card-shadow), 0 10px 20px rgba(0,0,0,0.08); min-height: 60px;
}

/* ===== Transport Card (wooden plaque) ===== */
.transport-card {
  border: 3px solid var(--card-border); border-radius: 20px; padding: 16px 18px;
  background: linear-gradient(180deg, var(--card-bg-soft), var(--bg-mid));
  box-shadow: 0 4px 0 var(--card-shadow), 0 8px 16px rgba(0,0,0,0.08);
  transition: box-shadow 0.2s, transform 0.2s;
  position: relative; cursor: default;
}
.transport-card:hover { box-shadow: 0 6px 0 var(--card-shadow), 0 12px 22px rgba(0,0,0,0.12); transform: translateY(-2px); }

/* Card header with route number */
.card-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}
.card-header .route-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 14px; border-radius: 12px; font-weight: 800; font-size: 1.05rem;
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif;
  box-shadow: 0 3px 0 rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.35);
}
.badge-kmb { background: linear-gradient(180deg, #ff8a80, #e53935); color: #fff; }
.badge-ctb { background: linear-gradient(180deg, #ffd54f, #ffb300); color: var(--text-dark); }
.badge-mtr { background: linear-gradient(180deg, #64b5f6, #1565c0); color: #fff; }
.badge-mtrbus { background: linear-gradient(180deg, #ba68c8, #7b1fa2); color: #fff; }
.company-label { font-size: 0.7rem; font-weight: 700; opacity: 0.9; }

.card-dest { font-size: 0.9rem; color: #6b5b45; margin-bottom: 6px; }
.card-stop { font-size: 0.8rem; color: #a08d6f; margin-bottom: 8px; }

/* ETA items */
.eta-list { list-style: none; }
.eta-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 0; font-size: 0.9rem;
}
.eta-time {
  font-family: 'Baloo 2', 'Nunito', sans-serif;
  font-weight: 800; font-size: 1.2rem; color: #4caf50;
  text-shadow: 0 1px 0 rgba(255,255,255,0.6);
}
.eta-time.soon { color: #e53935; }
.eta-time.medium { color: #ef6c00; }
.eta-detail { color: #a08d6f; font-size: 0.8rem; }

/* Favorite button (candy star) */
.fav-btn {
  position: absolute; top: 12px; right: 12px;
  background: linear-gradient(180deg, #fff, #f0e6d6);
  border: 2px solid #e0d3b8; font-size: 1.2rem; cursor: pointer;
  color: #c9b896; transition: all 0.2s; padding: 4px 9px; border-radius: 12px;
  box-shadow: 0 2px 0 var(--card-shadow);
}
.fav-btn:hover { background: #fff8e7; transform: scale(1.1); }
.fav-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--card-shadow); }
.fav-btn.favorited { color: #e53935; background: linear-gradient(180deg, #ffd6d6, #ffb3b3); border-color: #f0a0a0; }

/* Remove favorite button (inline in favorites) */
.fav-remove-btn {
  background: linear-gradient(180deg, #fff, #f7e6e6); border: 2px solid #e8c4c4; color: #c98a8a;
  padding: 4px 12px; border-radius: 10px; cursor: pointer; font-size: 0.75rem;
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif; font-weight: 700;
  box-shadow: 0 2px 0 #d9a8a8;
  transition: all 0.2s;
}
.fav-remove-btn:hover { background: #ffe0e0; color: #c62828; border-color: #ef9a9a; }
.fav-remove-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #d9a8a8; }

/* ===== Export button (overrides inline styles from JS) ===== */
#exportQuote0Btn, #exportQuote0Btn2 {
  background: linear-gradient(180deg, #ffd166, #f4a261) !important;
  color: var(--text-dark) !important;
  border: none !important;
  border-radius: 12px !important;
  box-shadow: 0 3px 0 #d98a3d, 0 4px 8px rgba(0,0,0,0.12) !important;
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif !important;
  font-weight: 700 !important;
  font-size: 13px !important;
  transition: transform 0.1s, box-shadow 0.1s !important;
}
#exportQuote0Btn:hover, #exportQuote0Btn2:hover { filter: brightness(1.05); }
#exportQuote0Btn:active, #exportQuote0Btn2:active {
  transform: translateY(2px) !important;
  box-shadow: 0 1px 0 #d98a3d !important;
}

/* ===== Weather & Sushiro Info Sections ===== */
.info-section {
  background: linear-gradient(180deg, var(--card-bg), var(--card-bg2));
  border: 3px solid var(--card-border);
  border-radius: 24px; padding: 22px; margin-bottom: 22px;
  box-shadow: 0 5px 0 var(--card-shadow), 0 10px 20px rgba(0,0,0,0.08);
}

/* ===== K75P Full-Route Live Board ===== */
.k75p-wrap { display: flex; flex-direction: column; gap: 8px; }
.k75p-stop {
  display: flex; align-items: center; gap: 10px;
  background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 14px;
  padding: 7px 12px;
}
.k75p-name { flex: 1; font-weight: 700; color: var(--text-dark); font-size: 0.95rem; }
.k75p-buses { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.k75p-bus {
  background: #eef7ee; border: 1px solid #bcd9bc; color: #2e6b2e;
  border-radius: 10px; padding: 2px 9px; font-size: 0.85rem; font-weight: 700;
  white-space: nowrap; font-family: 'Baloo 2', 'Nunito', sans-serif;
}
.k75p-bus.soon { background: #ffe9e9; border-color: #e8a0a0; color: #c0392b; }
.k75p-bus.delayed { background: #fff3d6; border-color: #e8c56a; color: #a06a00; }
.k75p-bus.scheduled { background: #eef2ff; border-color: #b8c4e8; color: #3a5a9a; }
.k75p-bus.k75p-none { background: #f4f1ea; border-color: #ddd5c5; color: #a08d6f; }
.k75p-fold-btn {
  display: block; width: 100%; margin: 2px 0;
  padding: 7px 10px; cursor: pointer;
  background: var(--card-bg2); border: 2px dashed #d9b98a; border-radius: 12px;
  font-size: 0.9rem; font-weight: 800; color: #8a6a3a;
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif;
  text-align: center; transition: background 0.2s;
}
.k75p-fold-btn:hover { background: #f7e6c8; }
.k75p-fold { display: none; }
.k75p-fold.open { display: block; }

.weather-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
}
.weather-item {
  background: linear-gradient(180deg, #eaf6ee, #dcefe2);
  border: 2px solid #c5e0cd; border-radius: 16px; padding: 12px 14px; text-align: center;
}
.weather-item .w-label { font-size: 0.75rem; color: #6b8f7a; font-weight: 700; }
.weather-item .w-value { font-size: 1.3rem; font-weight: 800; color: var(--primary-dark); font-family: 'Baloo 2', 'Nunito', sans-serif; }
.weather-item .w-sub { font-size: 0.75rem; color: #8aa89a; }
.weather-desc {
  text-align: center; font-size: 1.05rem; font-weight: 800; color: var(--primary-dark);
  font-family: 'Baloo 2', 'ZCOOL KuaiLe', sans-serif; margin-bottom: 12px;
}
.sushiro-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
}
.sushiro-card {
  border: 2px solid var(--card-border); border-radius: 16px; padding: 12px 14px;
  background: linear-gradient(180deg, var(--card-bg-soft), var(--bg-mid));
  box-shadow: 0 3px 0 var(--card-shadow);
}
.sushiro-card .s-name { font-weight: 800; font-size: 0.95rem; color: var(--text-dark); }
.sushiro-card .s-wait { font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 1.2rem; color: #4caf50; }
.sushiro-card .s-wait.soon { color: #e53935; }
.sushiro-card .s-wait.medium { color: #ef6c00; }
.sushiro-card .s-status { font-size: 0.7rem; color: #a08d6f; }
.sushiro-card.closed { opacity: 0.6; }
.sushiro-note { font-size: 0.75rem; color: #a08d6f; margin-top: 10px; text-align: center; }

/* ===== Footer ===== */
.footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; color: #a08d6f; font-size: 0.8rem; flex-wrap: wrap; gap: 8px;
}
.footer .status { display: flex; align-items: center; gap: 6px; }
.footer .dot {
  width: 10px; height: 10px; border-radius: 50%; display: inline-block;
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.dot-green { background: #4caf50; }
.dot-red { background: #e53935; }
.dot-yellow { background: #ff9800; }

/* ===== Loading & Errors ===== */
.loading { text-align: center; padding: 30px; color: #a08d6f; font-family: 'ZCOOL KuaiLe', 'Nunito', sans-serif; }
.loading .spinner {
  display: inline-block; width: 30px; height: 30px;
  border: 4px solid var(--card-border); border-top: 4px solid var(--primary);
  border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg {
  background: #fff3e0; border: 2px solid #ffe0b2; color: #e65100;
  padding: 12px 16px; border-radius: 14px; font-size: 0.9rem; margin: 10px 0;
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .navbar { padding: 12px 14px; }
  .navbar h1 { font-size: 1.1rem; }
  .container { padding: 14px 8px 24px; }
  .search-row { flex-direction: column; }
  .search-input { width: 100%; }
  .transport-toggle { width: 100%; justify-content: center; }
  .search-btn { width: 100%; }
  .card-grid { grid-template-columns: 1fr; }
  .search-section, .favorites-section, .results-section { padding: 16px; }
  .bg-decor .deco { font-size: 1.6rem; }
}

/* ==========================================================================
   Material Design 3 Skin
   依照 m3.material.io 规范：M3 baseline 色板(seed #6750A4) + 形状 token + 状态层
   ========================================================================== */
body[data-skin="md"] {
  /* M3 color tokens (light scheme) */
  --md-primary: #6750a4;
  --md-on-primary: #ffffff;
  --md-primary-container: #eaddff;
  --md-on-primary-container: #21005d;
  --md-secondary-container: #e8def8;
  --md-on-secondary-container: #1d192b;
  --md-tertiary-container: #ffd8e4;
  --md-error: #b3261e;
  --md-error-container: #f9dedc;
  --md-on-error-container: #410e0b;
  --md-surface: #fef7ff;
  --md-on-surface: #1d1b20;
  --md-on-surface-variant: #49454f;
  --md-surface-variant: #e7e0ec;
  --md-outline: #79747e;
  --md-outline-variant: #cac4d0;
  --md-surface-lowest: #ffffff;
  --md-surface-container: #f3edf7;
  --md-surface-high: #ece6f0;
  --md-surface-highest: #e6e0e9;
  /* M3 shape tokens */
  --md-corner-xs: 4px;
  --md-corner-s: 8px;
  --md-corner-m: 12px;
  --md-corner-l: 16px;
  --md-corner-xl: 28px;
  --md-corner-full: 999px;
  /* M3 elevation tokens（shadow + 表面色调分层） */
  --md-elev-0: none;
  --md-elev-1: 0 1px 2px rgba(29,27,32,0.3), 0 1px 3px 1px rgba(29,27,32,0.15);
  --md-elev-2: 0 1px 2px rgba(29,27,32,0.3), 0 2px 6px 2px rgba(29,27,32,0.15);
  --md-elev-3: 0 4px 8px 3px rgba(29,27,32,0.15), 0 1px 3px rgba(29,27,32,0.3);
  /* M3 type scale tokens（Roboto, 参考 title-large / title-medium / body-medium / label-large） */
  --md-type-title-large: 1.375rem;   /* 22px */
  --md-type-title-medium: 1rem;      /* 16px */
  --md-type-body-medium: 0.875rem;   /* 14px */
  --md-type-label-large: 0.875rem;   /* 14px */
  /* M3 motion：emphasized easing */
  --md-motion-ease: cubic-bezier(0.2, 0, 0, 1);
  /* 映射到既有变量（页面其它样式仍可用） */
  --bg-top: #f7f2fa;
  --bg-mid: #f3edf7;
  --bg-bottom: #ece6f0;
  --text: #1d1b20;
  --text-dark: #49454f;
  --primary: #6750a4;
  --primary-light: #eaddff;
  --primary-dark: #4f378b;
  --card-bg: #ffffff;

/* CORS proxy list – try each in order on failure */
const CORS_PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
];

/* ==========================================================================
   Utility Functions

/** Fetch with CORS proxy fallback */
async function fetchWithProxy(url, proxyIndex = 0) {
  try {
    const resp = await fetch(url, { signal: AbortSignal.timeout(15000) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.json();
  } catch (err) {
    if (err.name === 'TimeoutError' || err.name === 'AbortError') {
      throw new Error('请求超时，服务可能暂时不可用');
    }
    /* If it looks like a CORS / network error and we have proxies left, retry */
    if ((err.message.includes('Failed to fetch') || err.message.includes('NetworkError') || err.message.includes('CORS')) && proxyIndex < CORS_PROXIES.length) {
      const proxyUrl = CORS_PROXIES[proxyIndex](url);
      return fetchWithProxy(proxyUrl, proxyIndex + 1);
    }
    throw err;
  }
}

/** Format Unix timestamp (seconds) to HH:MM:SS */
function formatTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

/** Calculate minutes remaining from now */
function minsFromNow(etaTs) {
  const now = Math.floor(Date.now() / 1000);
  const diff = etaTs - now;
  if (diff < 0) return '<1分钟';
  if (diff < 60) return '<1分钟';
  return `${Math.floor(diff / 60)}分钟`;
}

/** Get ETA time class for color coding */
function etaColorClass(etaTs) {
  const now = Math.floor(Date.now() / 1000);
  const diff = etaTs - now;
  if (diff < 120) return 'soon';      /* < 2 min → red */
  if (diff < 600) return 'medium';    /* < 10 min → orange */
  return '';
}

/** Update status indicator */
function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const st = document.getElementById('statusText');
  dot.className = 'dot';
  if (state === 'ok') { dot.classList.add('dot-green'); st.textContent = text || '就绪'; }
  else if (state === 'error') { dot.classList.add('dot-red'); st.textContent = text || '错误'; }
  else { dot.classList.add('dot-yellow'); st.textContent = text || '载入中'; }
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

/** Debounce utility */
function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];

}

function saveFavorites(favs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
}

/** Check if a route is in favorites */
function isFavorited(item) {
  const favs = getFavorites();
  if (item.type === 'mtr') {
    return favs.some(f => f.type === 'mtr' && f.line === item.line && f.station_id === item.station_id);
  }
  if (item.type === 'mtrbus') {
    return favs.some(f => f.type === 'mtrbus' && f.route === item.route && f.stop_id === item.stop_id);
  }
  return favs.some(f => f.type === 'bus' && f.company === item.company && f.route === item.route && f.stop_id === item.stop_id);
}

/** Add to favorites */
function addFavorite(item) {
  const favs = getFavorites();
  if (isFavorited(item)) return;
  favs.push(item);
  saveFavorites(favs);
  renderFavorites();
}

/** Remove from favorites */
function removeFavorite(index) {
  const favs = getFavorites();
  favs.splice(index, 1);
  saveFavorites(favs);
  renderFavorites();
}

/** Get MTR Bus ETA for a route (POST method) */
async function getMTRBusETA(routeName) {
  const url = 'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule';
  const body = JSON.stringify({ language: 'zh', routeName: routeName });
  try {
    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, signal: AbortSignal.timeout(15000) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.json();
  } catch (err) {
    for (const proxyFn of CORS_PROXIES) {
      try {
        const proxyUrl = proxyFn(url);
        const resp = await fetch(proxyUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
        if (resp.ok) return await resp.json();
      } catch {}
    }
    return null;
  }
}

/** Parse MTR Bus ETA response (busStop → flat eta list) */
function parseMTRBusETAData(etaData) {
  if (!etaData || !etaData.busStop || !Array.isArray(etaData.busStop)) return [];
  const etas = [];
  const nowMs = Date.now();
  for (const stop of etaData.busStop) {
    const stopName = stop.busStopId || '';
    for (const bus of (stop.bus || [])) {
      const arrivalSec = parseInt(bus.arrivalTimeInSecond) || 0;
      etas.push({
        eta: new Date(nowMs + arrivalSec * 1000).toISOString(),
        stop_name: stopName,
        arrivalText: bus.arrivalTimeText || '',
        departureText: bus.departureTimeText || '',
        isScheduled: bus.isScheduled === '1'
      });
    }
  }
  return etas;
}

/** Search bus routes across KMB and CTB */
async function searchBusRoute(query, container) {
  const routeNum = query.toUpperCase().replace(/\s/g, '');
  let allResults = [];

  /* Search both companies in parallel */
  const [kmbRoutes, ctbRoutes] = await Promise.all([
    searchKMBRoute(routeNum),
    searchCTBRoute(routeNum)
  ]);

  /* For each KMB route, get stops and first stop ETA */
  for (const route of kmbRoutes) {
    const direction = route.bound === 'O' ? 'outbound' : 'inbound';
    const stops = await getKMBStops(route.route, direction, '1');
    if (stops.length > 0) {
      const firstStop = stops[0];
      allResults.push({
        type: 'bus', company: 'kmb',
        route: route.route,
        direction: direction,
        origDest: route.orig_en ? `${route.orig_tc || route.orig_en} → ${route.dest_tc || route.dest_en}` : '',
        stop_id: firstStop.stop_id || firstStop.stop,
        stop_name: firstStop.name_tc || firstStop.name_en || firstStop.stop_id,
        serviceType: '1'
      });
    }
  }

  /* For each CTB route, get stops and first stop ETA */
  for (const route of ctbRoutes) {
    /* CTB route-stop API needs 'outbound'/'inbound' (lowercase), not 'O'/'I' */
    for (const dir of ['outbound', 'inbound']) {
      const stops = await getCTBStops(route.route, dir);
      if (stops.length > 0) {
        /* 城巴 ETA API 对部分站点(尤其总站/前几站)返回空数据，
           并行探测前几个站，取第一个有本方向班次的站作为展示站 */
        const wantDir = dir === 'inbound' ? 'I' : 'O';
        const probes = await Promise.all(
          stops.slice(0, 6).map(async (s) => {
            const etas = await getCTBETA(s.stop || s.stop_id, route.route);
            return { s, ok: etas.some(e => (e.dir || '').toUpperCase() === wantDir) };
          })
        );
        let firstStop = null;
        for (const p of probes) { if (p.ok) { firstStop = p.s; break; } }
        if (!firstStop) firstStop = stops[0];
        allResults.push({
          type: 'bus', company: 'ctb',
          route: String(route.route),
          direction: dir,
          origDest: route.orig_tc && route.dest_tc
            ? (dir === 'inbound' ? `${route.dest_tc} → ${route.orig_tc}` : `${route.orig_tc} → ${route.dest_tc}`)
            : '',
          stop_id: firstStop.stop || firstStop.stop_id,
          stop_name: firstStop.stop || firstStop.stop_id,
        });
      }
    }
  }

  if (allResults.length === 0) {
    container.innerHTML = '<div class="empty-hint">找不到路线「' + escapeHtml(query) + '」，请确认路线编号是否正确</div>';
    setStatus('ok');
    return;
  }

  /* Fetch ETA for each result stop and render */
  const etaResults = await Promise.all(
    allResults.map(async (item) => {
      let etas = [];
      if (item.company === 'kmb') {
        etas = await getKMBETA(item.stop_id);
        /* Filter to only this route */
        etas = etas.filter(e => e.route === item.route);
      } else {
        etas = await getCTBETA(item.stop_id, item.route);
        /* Filter to this direction: O=outbound(去铜锣湾), I=inbound(回天水围) */
        const wantDir = item.direction === 'inbound' ? 'I' : 'O';
        etas = etas.filter(e => (e.dir || '').toUpperCase() === wantDir);
      }
      return { ...item, etas: etas.slice(0, 3) };
    })
  );

  renderSearchResults(etaResults, container);
  setStatus('ok');
}

/** Search MTR station by name */
async function searchMTRStation(query, container) {
  /* MTR station name → station_id mapping (common stations) */
  const stationMap = {
    '中环': 'CEN', '金钟': 'ADM', '尖沙咀': 'TST', '旺角': 'MOK', '九龙塘': 'KOT',
    '铜锣湾': 'CAB', '北角': 'NOP', '太古': 'TAK', '鲗鱼涌': 'QUB', '湾仔': 'WAC',
    '上环': 'SHW', '佐敦': 'JOR', '油麻地': 'YMT', '太子': 'PRE',
    '深水埗': 'SSP', '长沙湾': 'CSW', '荔枝角': 'LCK', '美孚': 'MEF', '荔景': 'LAK',
    '葵芳': 'KWF', '葵兴': 'KWH', '大窝口': 'TWH', '荃湾': 'TSW',
    '彩虹': 'CHH', '钻石山': 'DIH', '黄大仙': 'WTS', '乐富': 'LOF', '石硖尾': 'SKM',
    '九龙湾': 'KOB', '牛头角': 'NTK', '观塘': 'KWT', '蓝田': 'LAT', '调景岭': 'TIK',
    '油塘': 'YAT', '坑口': 'HAH', '宝琳': 'POA', '康城': 'LHP',
    '香港': 'HOK', '九龙': 'KOW', '青衣': 'TSY', '东涌': 'TUC', '欣澳': 'SUN',
    '红磡': 'HUH', '大围': 'TAW', '沙田': 'SHT', '火炭': 'FOT', '大学': 'UNI',
    '大埔墟': 'TPM', '太和': 'TWO', '粉岭': 'FAN', '上水': 'SHS', '落马洲': 'LMC',
    '罗湖': 'LOH', '马鞍山': 'MOS', '恒安': 'HEO', '大水坑': 'TSH',
    '石门': 'SHM', '第一城': 'CKT', '美林': 'MLN', '显径': 'HIK', '启德': 'KAT',
    '宋皇台': 'SUW', '土瓜湾': 'TKW', '何文田': 'HOM', '黄埔': 'WHA',
    '南昌': 'NAC', '柯士甸': 'AUS', '尖东': 'ETS', '屯门': 'TUM', '兆康': 'SIO',
    '天水围': 'TIS', '朗屏': 'LOP', '元朗': 'YUL', '锦上路': 'KSR',
    '海洋公园': 'OCP', '黄竹坑': 'WCH', '利东': 'LET', '海怡半岛': 'SOH'
  };

  /* Find matching stations */
  const matchedStations = [];
  const q = query.trim();
  for (const [name, code] of Object.entries(stationMap)) {
    if (name.includes(q) || q.includes(name)) {
      matchedStations.push({ name, code });
    }
  }

  if (matchedStations.length === 0) {
    /* Try direct station code match */
    const upperQuery = q.toUpperCase();
    for (const [name, code] of Object.entries(stationMap)) {
      if (code === upperQuery) {
        matchedStations.push({ name, code });
      }
    }
  }

  if (matchedStations.length === 0) {
    container.innerHTML = '<div class="empty-hint">找不到车站「' + escapeHtml(query) + '」，请尝试输入车站名称（如：中环、旺角）</div>';
    setStatus('ok');
    return;
  }

  /* Fetch schedules for all matched stations across all lines */
  const allLineResults = [];
  for (const station of matchedStations) {
    const lineChecks = Object.keys(MTR_LINES).map(async (lineCode) => {
      try {
        const schedule = await getMTRSchedule(lineCode, station.code);
        if (schedule && Object.keys(schedule).length > 0) {
          return {
            type: 'mtr',
            line: lineCode,
            lineName: MTR_LINES[lineCode] || lineCode,
            station_id: station.code,
            station_name: station.name,
            schedule: schedule
          };
        }
      } catch {}
      return null;
    });
    const results = await Promise.all(lineChecks);
    for (const r of results) {
      if (r) allLineResults.push(r);
    }
  }

  if (allLineResults.length === 0) {
    container.innerHTML = '<div class="empty-hint">车站「' + escapeHtml(query) + '」目前没有即时到站数据</div>';
    setStatus('ok');
    return;
  }

  renderMTRSearchResults(allLineResults, container);
  setStatus('ok');
}

/** Search MTR Bus route by number */
async function searchMTRBus(query, container) {
  const routeNum = query.toUpperCase().replace(/\s/g, '');
  const routeInfo = MTR_BUS_ROUTES[routeNum];

  /* Try API even if route not in built-in list (for variants like K75P) */
  const etaData = await getMTRBusETA(routeNum);

  if (!routeInfo && (!etaData || !etaData.busStop || !Array.isArray(etaData.busStop) || etaData.busStop.length === 0)) {
    container.innerHTML = '<div class="empty-hint">找不到港铁巴士路线「' + escapeHtml(query) + '」，请确认路线编号（如 K51、K65、K75P）</div>';
    setStatus('ok');
    return;
  }

  const item = {
    type: 'mtrbus',
    route: routeNum,
    orig: routeInfo ? routeInfo.orig : routeNum,
    dest: routeInfo ? routeInfo.dest : '',
    orig_en: routeInfo ? routeInfo.orig_en : '',
    dest_en: routeInfo ? routeInfo.dest_en : '',
    etas: []
  };

  if (etaData) {
    item.etas = parseMTRBusETAData(etaData).slice(0, 8);
    /* Capture dest from built-in route info if available */
    if (!item.dest && item.etas.length > 0) {
      const first = item.etas[0];
      if (first.stop_name) item.dest = first.stop_name;
    }
  }

  renderMTRBusResults([item], container);
  setStatus('ok');
}

/** Load live ETA data for all favorites */
async function loadFavoritesETA(favs, container) {
  const promises = favs.map(async (fav, index) => {
    let etas = [];
    if (fav.type === 'bus') {
      if (fav.company === 'kmb') {
        const allEta = await getKMBETA(fav.stop_id);
        etas = allEta.filter(e => e.route === fav.route).slice(0, 3);
      } else { /* ctb */
        etas = await getCTBETA(fav.stop_id, fav.route);
        etas = etas.slice(0, 3);
      }
    } else if (fav.type === 'mtrbus') {
      const etaData = await getMTRBusETA(fav.route);
      if (etaData) {
        etas = parseMTRBusETAData(etaData).slice(0, 8);
      }
    } else { /* mtr */
      const schedule = await getMTRSchedule(fav.line, fav.station_id);
      if (schedule) {
        const keys = Object.keys(schedule).slice(0, 4);
        for (const key of keys) {
          const data = schedule[key];
          if (data && data.time) {
            const etaTs = new Date(data.time).getTime() / 1000;
            const dirLabel = key.startsWith('UP') ? '上行' : '下行';
            etas.push({ time: data.time, etaTs, dirLabel });
          }
        }
      }
    }
    return { ...fav, index, etas };
  });

  const results = await Promise.all(promises);
  renderFavoritesCards(results, container);
  setStatus('ok');
}

/** Render favorite cards */
function renderFavoritesCards(items, container) {
  if (items.length === 0) {
    container.innerHTML = '<div class="empty-hint">暂无收藏路线</div>';

      if (item.etas && item.etas.length > 0) {
        for (const eta of item.etas) {
          let etaTs;
          if (item.company === 'kmb') {
            etaTs = eta.eta ? new Date(eta.eta).getTime() / 1000 : null;
          } else {

          } else if (eta.rmk_tc || eta.rmk_en) {

      }

      html += '<ul class="eta-list">';
      if (item.etas && item.etas.length > 0) {

   ========================================================================== */

function toggleFav(btn, itemJson) {
  const item = JSON.parse(itemJson);
  toggleFavByItem(item, btn);
}

function toggleFavByItem(item, btn) {
  if (isFavorited(item)) {
    /* Remove from favorites */
    const favs = getFavorites();
    let idx = -1;
    if (item.type === 'mtr') {
      idx = favs.findIndex(f => f.type === 'mtr' && f.line === item.line && f.station_id === item.station_id);
    } else if (item.type === 'mtrbus') {
      idx = favs.findIndex(f => f.type === 'mtrbus' && f.route === item.route && f.stop_id === item.stop_id);
    } else {
      idx = favs.findIndex(f => f.type === 'bus' && f.company === item.company && f.route === item.route && f.stop_id === item.stop_id);
    }
    if (idx >= 0) {
      favs.splice(idx, 1);
      saveFavorites(favs);
    }
    btn.classList.remove('favorited');
    btn.textContent = '☆';
  } else {
    /* Build a clean favorite item */
    const fav = { type: item.type };
    if (item.type === 'bus') {
      fav.company = item.company;
      fav.route = item.route;
      fav.stop_id = item.stop_id || '';
      fav.stop_name = item.stop_name || '';
      fav.destination = item.origDest || '';
      fav.direction = item.direction || (item.company === 'kmb' ? 'outbound' : 'outbound');
    } else if (item.type === 'mtrbus') {
      fav.route = item.route;
      fav.orig = item.orig;
      fav.dest = item.dest;
      fav.stop_id = item.stop_id || '';
    } else {
      fav.line = item.line;
      fav.lineName = item.lineName || (MTR_LINES[item.line] || item.line);
      fav.station_id = item.station_id;
      fav.station_name = item.station_name;
    }
    addFavorite(fav);
    btn.classList.add('favorited');
    btn.textContent = '★';
  }
  renderFavorites();
}

/** Export favorites as JSON file for Quote/0 push script */
function exportFavoritesForQuote0() {
  const favs = getFavorites();
  if (favs.length === 0) {
    alert('暂无收藏路线');
    return;
  }
  const exportData = favs.map(f => {
    const clean = { ...f };
    delete clean.index;
    delete clean.etas;
    return clean;
  });
  const jsonStr = JSON.stringify(exportData, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hk-favorites.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/** Fetch & render HKO real-time weather */
async function refreshWeather() {
  const container = document.getElementById('weatherContainer');
  const badge = document.getElementById('weatherUpdate');
  try {
    const resp = await fetch(WEATHER_API, { signal: AbortSignal.timeout(15000) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    /* Temperature: prefer 元朗公園 station */
    const temps = (data.temperature && data.temperature.data) || [];
    const hkoTemp = temps.find(t => t.place === '元朗公園') || temps.find(t => t.place === '香港天文台') || temps[0];
    /* Humidity */
    const hum = (data.humidity && data.humidity.data && data.humidity.data[0]) || null;
    /* Rainfall: prefer 元朗 district */
    const rains = (data.rainfall && data.rainfall.data) || [];
    const rain = rains.find(r => r.place === '元朗') || rains.find(r => r.main === 'TRUE') || rains[0] || null;
    /* Icon */
    const icon = Array.isArray(data.icon) ? data.icon[0] : data.icon;
    const desc = HKO_ICONS[icon] || '未知';
    const emoji = HKO_ICON_EMOJI[icon] || '🌤️';

    let html = `<div class="weather-desc">${emoji} ${desc}</div><div class="weather-grid">`;
    if (hkoTemp) {
      html += `<div class="weather-item"><div class="w-label">温度</div><div class="w-value">${hkoTemp.value}°C</div><div class="w-sub">${hkoTemp.place}</div></div>`;
    }
    if (hum) {
      html += `<div class="weather-item"><div class="w-label">湿度</div><div class="w-value">${hum.value}%</div><div class="w-sub">${hum.place}</div></div>`;
    }
    if (rain) {
      html += `<div class="weather-item"><div class="w-label">雨量</div><div class="w-value">${rain.max}mm</div><div class="w-sub">${rain.place}</div></div>`;
    }
    html += '</div>';
    container.innerHTML = html;
    badge.textContent = data.updateTime ? data.updateTime.slice(11, 16) : '';
  } catch (err) {
    container.innerHTML = '<div class="error-msg">天气载入失败：' + (err.message || '网络错误') + '</div>';
    badge.textContent = '';
  }
}

/* ==========================================================================
   Sushiro Queue (via corsproxy.io)
   ========================================================================== */

/** Fetch & render Sushiro store queue status */
async function refreshSushiro() {
  const container = document.getElementById('sushiroContainer');
  const badge = document.getElementById('sushiroUpdate');
  try {
    const resp = await fetch(SUSHIRO_PROXY(SUSHIRO_STORE_API), { signal: AbortSignal.timeout(20000) });
    if (!resp.ok) {
      if (resp.status === 403) {
        container.innerHTML = '<div class="error-msg">寿司郎资料需从 http://localhost 打开网页才能载入（corsproxy.io 限制）。请用「启动网页.bat」或 python -m http.server 开启本地服务。</div>';
        badge.textContent = '';
        return;
      }
      throw new Error(`HTTP ${resp.status}`);
    }
    const allStores = await resp.json();
    if (!Array.isArray(allStores) || allStores.length === 0) {
      container.innerHTML = '<div class="empty-hint">暂时没有分店资料</div>';
      badge.textContent = '';
      return;
    }

    /* 只显示新界西分店（葵青/荃湾/屯门/元朗/离岛） */
    const NTW_AREAS = ['葵青區', '荃灣區', '屯門區', '元朗區', '離島區'];
    const stores = allStores.filter(s => NTW_AREAS.includes(s.area));
    if (stores.length === 0) {
      container.innerHTML = '<div class="empty-hint">新界西暂时没有分店资料</div>';
      badge.textContent = '';
      return;
    }

    /* Sort: open stores first, then by wait time */
    const sorted = [...stores].sort((a, b) => {
      const aOpen = a.storeStatus === 'OPEN' ? 0 : 1;
      const bOpen = b.storeStatus === 'OPEN' ? 0 : 1;
      if (aOpen !== bOpen) return aOpen - bOpen;
      return (a.wait || 0) - (b.wait || 0);
    });

    let html = '<div class="sushiro-grid">';
    for (const s of sorted) {
      const open = s.storeStatus === 'OPEN';
      const wait = s.wait || 0;
      const groups = s.waitingGroup || 0;
      const closed = !open || s.netTicketStatus === 'OFFLINE_CLOSING' || s.netTicketStatus === 'CLOSED';
      let waitClass = '';
      let waitText;
      if (closed) {
        waitText = '已停飞';
        waitClass = 'soon';
      } else if (wait <= 0) {
        waitText = '直入';
      } else if (wait < 30) {
        waitText = `${wait}分钟`;
        waitClass = 'medium';
      } else {
        waitText = `${wait}分钟`;
      }
      html += `<div class="sushiro-card${closed ? ' closed' : ''}">
        <div class="s-name">${s.name || ('分店' + s.id)}</div>
        <div class="s-wait ${waitClass}">${waitText}</div>
        <div class="s-status">${closed ? '未营业/停止派飞' : (groups > 0 ? `等候 ${groups} 组` : '无需等候')} · ${s.area || ''}</div>
      </div>`;
    }
    html += '</div>';
    html += '<div class="sushiro-note">数据来源：寿司郎官方 sushipass API（经 corsproxy.io 代理）· 每 15 秒自动更新</div>';
    container.innerHTML = html;
    badge.textContent = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    container.innerHTML = '<div class="error-msg">寿司郎排队资料载入失败：' + (err.message || '网络错误') + '</div>';
    badge.textContent = '';
  }
}

/** 解析 departureTimeText（HH:MM 或 HH:MM:SS）为 "HH:MM" */
function parseDepartureText(text) {
  if (!text) return '';
  const m = String(text).match(/(\d{1,2}):(\d{2})/);
  return m ? m[1] + ':' + m[2] : '';
}

/** 载入 K75P 全线 23 站实时班次并渲染 */
async function loadK75PAllStops() {
  const container = document.getElementById('k75pContainer');
  const badge = document.getElementById('k75pUpdate');
  if (!container) return;
  try {
    const data = await getMTRBusETA('K75P');
    if (!data || !data.busStop) throw new Error('无资料');

    /* 按站分组：过滤占位班次（arrival>=108000），保留发车时间；按到站秒数排序取前 3 班 */
    const stopMap = {};
    for (const stop of data.busStop) {
      const buses = (stop.bus || []).map(b => {
        const sec = parseInt(b.arrivalTimeInSecond) || 0;
        return {
          sec,
          depText: parseDepartureText(b.departureTimeText),
          isDelayed: b.isDelayed === '1',
          isScheduled: b.isScheduled === '1'
        };
      }).filter(b => (b.sec > 0 && b.sec < 108000) || b.depText)
        .sort((a, b) => (a.sec > 0 && a.sec < 108000 ? a.sec : 999999) - (b.sec > 0 && b.sec < 108000 ? b.sec : 999999))
        .slice(0, 3);
      stopMap[(stop.busStopId || '').replace(/^K75P-/, '')] = buses;
    }

    let html = '<div class="k75p-wrap">';
    let foldOpen = false;
    for (const stop of K75P_STOPS) {
      if (stop.fold && !foldOpen) {
        foldOpen = true;
        html += '<button type="button" class="k75p-fold-btn" id="k75pFoldBtn" onclick="toggleK75PFold()">厦村市 ▾</button>';
        html += '<div class="k75p-fold" id="k75pFold">';
      } else if (!stop.fold && foldOpen) {
        foldOpen = false;
        html += '</div>';
      }
      const buses = stopMap[stop.id] || [];
      html += '<div class="k75p-stop">';
      html += `<span class="k75p-name">${escapeHtml(stop.name)}</span>`;
      html += '<span class="k75p-buses">';
      if (buses.length === 0) {
        html += '<span class="k75p-bus k75p-none">暂无班次</span>';
      } else {
        for (const b of buses) {
          let cls = '';
          let label = '';
          if (b.sec > 0 && b.sec < 108000) {
            const mins = Math.max(1, Math.ceil(b.sec / 60));
            if (b.sec <= 60) { cls = 'soon'; label = '即将到站'; }
            else { label = mins + ' 分钟'; }
            if (b.isDelayed) { cls = 'delayed'; label += ' · 延误'; }
            else if (b.isScheduled) { cls = 'scheduled'; label += ' · 定时'; }
          } else if (b.depText) {
            cls = 'scheduled'; label = b.depText + ' 发车';
          }
          html += `<span class="k75p-bus ${cls}">${label}</span>`;
        }
      }
      html += '</span></div>';
    }
    if (foldOpen) html += '</div>';
    html += '</div>';
    container.innerHTML = html;
    badge.textContent = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    container.innerHTML = '<div class="error-msg">K75P 全线资料载入失败：' + (err.message || '网络错误') + '</div>';
    badge.textContent = '';
  }
}

/** Refresh all favorites ETA */
async function refreshAll() {
  const btn = document.getElementById('refreshBtn');

}

/* ===== Skin switching (AC vs Material Design 3) ===== */
const SKIN_KEY = 'marvis_skin';
function applySkin(skin) {
  const s = skin === 'dog' ? 'md' : skin; /* 兼容旧版保存的 dog 值 */
  if (s === 'md') {
    document.body.dataset.skin = 'md';
  } else {
    delete document.body.dataset.skin;
  }
  const btn = document.getElementById('skinBtn');
  if (btn) btn.textContent = s === 'md' ? '🎨' : '🍃';
}
function toggleSkin() {
  const current = document.body.dataset.skin === 'md' ? 'md' : 'ac';
  const next = current === 'md' ? 'ac' : 'md';
  applySkin(next);
  try { localStorage.setItem(SKIN_KEY, next); } catch (e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  /* Apply saved skin */
  let savedSkin = 'ac';
  try { savedSkin = localStorage.getItem(SKIN_KEY) || 'ac'; } catch (e) {}
  applySkin(savedSkin);

  /* Transport type toggle */
  document.getElementById('transportToggle').addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') {
      document.querySelectorAll('#transportToggle button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentTransport = e.target.dataset.type;
      /* Update placeholder */
      const input = document.getElementById('searchInput');
      if (currentTransport === 'bus') {
        input.placeholder = '输入巴士路线编号（如 1A、10）...';
      } else if (currentTransport === 'mtrbus') {
        input.placeholder = '输入港铁巴士路线编号（如 K51、K65）...';
      } else {
        input.placeholder = '输入港铁车站名称（如 中环、旺角）...';
      }
      /* Clear results */
      document.getElementById('resultsContainer').innerHTML = '<div class="empty-hint">请在上方搜寻巴士路线或港铁车站</div>';
    }
  });

  /* Initial render */
  renderFavorites();
  startAutoRefresh();

  /* Initial weather & sushiro & K75P load */
  refreshWeather();
  refreshSushiro();
  loadK75PAllStops();

  /* Initial status */
  setStatus('ok');

  /* Global event delegation for favorite buttons */
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.fav-btn');
    if (!btn) return;
    e.preventDefault();
    const itemJson = btn.getAttribute('data-fav-item');
    if (!itemJson) return;
    try {
      const item = JSON.parse(itemJson);
      toggleFavByItem(item, btn);
    } catch (err) {
      console.error('Favorite parse error:', err);
    }
  });
});

/* Cleanup on page unload */
window.addEventListener('beforeunload', () => {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
});
</script>
<script>
/* PWA: register service worker for offline & installability */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.warn('Service Worker 注册失败:', err);
    });
  });
}
</script>
</body>
</html>
