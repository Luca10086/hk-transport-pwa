<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K75P 實時路線 · 澳泊式介面 Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* ===== 澳泊式介面複刻（K75P 數據）：地圖頂 + 大路線號 + 三張預報卡 + 狀態列 + 底部標籤 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #E9EDF2; color: #14213D; font-family: 'Noto Sans TC', 'Segoe UI', sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 420px; height: 100vh; background: #F7F9FC; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 24px rgba(0,0,0,.12); }
  /* ---- 地圖區 ---- */
  .map { flex: 0 0 46vh; position: relative; background: #DFE8DC; }
  .map .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #5C6B7A; font-size: 14px; text-align: center; padding: 20px; }
  .map-topbar {
    position: absolute; top: 10px; left: 10px; right: 10px; z-index: 500;
    display: flex; align-items: center; gap: 8px; pointer-events: none;
  }
  .map-back {
    pointer-events: auto; width: 34px; height: 34px; border: none; border-radius: 50%;
    background: #fff; color: #14213D; font-size: 18px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .map-chip {
    background: #fff; border-radius: 14px; padding: 6px 12px; font-size: 13px; font-weight: 600;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
  .map-live {
    margin-left: auto; background: #0A84FF; color: #fff; border-radius: 12px; padding: 5px 10px;
    font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  /* ---- 巴士圖標 ---- */
  .busm { width: 28px; height: 16px; }
  .busm svg { width: 28px; height: 16px; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  /* ---- 資訊面板 ---- */
  .panel { flex: 1; overflow-y: auto; padding: 14px 16px 70px; background: #F7F9FC; }
  .head { display: flex; align-items: baseline; gap: 10px; }
  .head .no { font-size: 44px; font-weight: 800; color: #0A84FF; letter-spacing: -1px; }
  .head .dest { font-size: 20px; font-weight: 700; }
  .head .meta { font-size: 13px; color: #6B7A90; margin-top: 2px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .card { background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 12px; padding: 10px 9px; }
  .card .lab { font-size: 12px; color: #6B7A90; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .card .gps { font-size: 10px; background: #0A84FF; color: #fff; border-radius: 4px; padding: 1px 4px; }
  .card .gps.off { background: #B9C2CE; }
  .card .big { font-size: 20px; font-weight: 700; color: #14213D; margin-top: 8px; white-space: nowrap; }
  .card .sub { font-size: 12px; color: #6B7A90; margin-top: 3px; white-space: nowrap; }
  /* ---- 狀態列 ---- */
  .status {
    margin-top: 12px; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 12px;
    padding: 11px 12px; font-size: 13px; color: #14213D; line-height: 1.7;
  }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #12B76A; margin-right: 6px; }
  .status b { color: #0A84FF; font-weight: 700; }
  .status .gps { font-size: 10px; background: #0A84FF; color: #fff; border-radius: 4px; padding: 1px 5px; margin: 0 2px; }
  /* ---- 底部標籤 ---- */
  .tabs {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 600;
    display: flex; background: #FFFFFF; border-top: 1px solid #E3E8EF;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabs span {
    flex: 1; text-align: center; font-size: 12px; color: #6B7A90; padding: 6px 0; cursor: pointer;
  }
  .tabs span.on { color: #0A84FF; font-weight: 700; }
</style>

<script>
(function () {
  'use strict';
  const STOPS = window.DEMO_K75P_STOPS || [];
  const COORDS = window.DEMO_K75P_COORDS || {};
  let snapshot = window.DEMO_K75P_SNAPSHOT || { at: '', stops: [] };
  const $ = (id) => document.getElementById(id);
  const mmss = (sec) => {
    if (sec <= 0) return '00:00';
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  };
  const minsOf = (sec) => Math.max(1, Math.round(sec / 60)) + ' 分鐘';
  const escapeHtml = (x) => String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  if (!STOPS.length || !snapshot.at) { $('cards').innerHTML = '<div class="card"><div class="lab">數據未載入</div></div>'; return; }

  /* ================= 模型（與 App 同源：GPS 投影 + 秒數兜底 + 交叉校驗） ================= */
  const coords = {};
  if (COORDS) for (const k of Object.keys(COORDS)) { const c = COORDS[k]; if (c && c.lat) coords[k] = { lat: c.lat, lng: c.lng }; }
  function segPointFrac(a, b, p) {
    const kx = 111320 * Math.cos(a.lat * Math.PI / 180), ky = 110540;
    const bx = (b.lng - a.lng) * kx, by = (b.lat - a.lat) * ky;
    const px = (p.lng - a.lng) * kx, py = (p.lat - a.lat) * ky;
    const len2 = bx * bx + by * by;
    if (len2 < 1e-6) return { d2: px * px + py * py, f: 0 };
    let t = (px * bx + py * by) / len2; t = Math.max(0, Math.min(1, t));
    const cx = bx * t, cy = by * t;
    return { d2: (px - cx) * (px - cx) + (py - cy) * (py - cy), f: t };
  }
  function gpsLoopPosition(p, refPos) {
    let best = null;
    for (let i = 0; i < STOPS.length; i++) {
      const a = coords[STOPS[i].id], b = coords[STOPS[(i + 1) % STOPS.length].id];
      if (!a || !b) continue;
      const r = segPointFrac(a, b, p);
      const score = r.d2 + 4000 * Math.abs((i + r.f) - refPos);
      if (!best || score < best.score) best = { score, d2: r.d2, pos: i + r.f };
    }
    return (best && Math.sqrt(best.d2) < 300) ? best.pos : null;
  }
  function buildModel(data) {
    const stopMap = {};
    (data.stops || []).forEach(st => { stopMap[st.id] = st.bus || []; });
    const byBus = {};
    for (let i = 0; i < STOPS.length; i++) {
      for (const b of (stopMap[STOPS[i].id] || [])) {
        const sec = parseInt(b.sec, 10);
        if (isNaN(sec) || sec < 0 || sec >= 108000) continue;
        const live = !!(Number(b.la) && Number(b.ln));
        if (live && sec === 0) coords[STOPS[i].id] = { lat: Number(b.la), lng: Number(b.ln) };
        const id = String(b.id || '?');
        if (!byBus[id]) byBus[id] = { live: false, entries: [] };
        if (live) byBus[id].live = true;
        byBus[id].entries.push({ idx: i, sec, loc: live ? { lat: Number(b.la), lng: Number(b.ln) } : null });
      }
    }
    const markers = [], chips = [];
    for (const id of Object.keys(byBus)) {
      const bus = byBus[id];
      if (!bus.entries.length) continue;
      const es = bus.entries.slice().sort((a, b) => a.sec - b.sec);
      const next = es[0];
      chips.push({ idx: next.idx, sec: next.sec, live: bus.live });
      if (!bus.live || !next.loc) continue;
      const next2 = es.find(e => e.idx !== next.idx && e.sec > next.sec);
      const gap = next2 ? Math.max(30, next2.sec - next.sec) : 120;
      const f = next.sec === 0 ? 1 : Math.max(0, Math.min(1, (gap - next.sec) / gap));
      const refPos = next.idx === 0 ? 0 : next.idx - 1 + f;
      let pos = gpsLoopPosition(next.loc, refPos);
      if (pos != null && Math.abs(pos - refPos) > 2) pos = null;
      if (pos == null) pos = refPos;
      markers.push({ id, pos, nextIdx: next.idx, nextName: STOPS[next.idx].name, nextSec: next.sec, gap: Math.max(10, gap) });
    }
    return { markers, chips };
  }

  /* ================= 地圖（Leaflet + OSM）：路線線 + 站點 + 移動巴士 ================= */
  let map = null, routeLine = null;
  const busMarkers = {};
  let cum = [];
  function haversine(a, b) {
    const R = 6371000, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function buildRoute() {
    const pts = STOPS.map(st => coords[st.id]).filter(Boolean);
    if (pts.length < 2) return false;
    cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + haversine(pts[i - 1], pts[i]));
    L.polyline(pts, { color: '#FFFFFF', weight: 8, opacity: .9 }).addTo(map);
    routeLine = L.polyline(pts, { color: '#0A84FF', weight: 4, opacity: .95 }).addTo(map);
    L.layerGroup(pts.map((p, i) => L.circleMarker(p, {
      radius: i === 0 || i === pts.length - 1 ? 7 : 5,
      color: '#FFFFFF', weight: 2.5, fillColor: '#0A84FF', fillOpacity: 1,
    }).bindTooltip(STOPS[i].name, { direction: 'right', offset: [8, 0] }))).addTo(map);
    map.fitBounds(L.latLngBounds(pts), { padding: [34, 34] });
    return true;
  }
  function pointAtPos(pos) {
    const pts = STOPS.map(st => coords[st.id]).filter(Boolean);
    if (!cum.length || pts.length < 2) return pts[0] ? L.latLng(pts[0].lat, pts[0].lng) : L.latLng(22.45, 114.0);
    const seg = Math.min(pts.length - 2, Math.floor(pos));
    const f = pos - seg;
    const target = cum[seg] + f * (cum[seg + 1] - cum[seg]);
    let j = 0;
    while (j < pts.length - 2 && cum[j + 1] < target) j++;
    const span = cum[j + 1] - cum[j];
    const t = span > 0 ? (target - cum[j]) / span : 0;
    return L.latLng(
      pts[j].lat + (pts[j + 1].lat - pts[j].lat) * t,
      pts[j].lng + (pts[j + 1].lng - pts[j].lng) * t);
  }
  function initMap() {
    if (!window.L) { $('mapFallback').hidden = false; $('mapLive').textContent = '地圖離線'; return; }
    map = L.map('map', { zoomControl: false, attributionControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    if (!buildRoute()) $('mapFallback').hidden = false;
    setTimeout(() => { if (map) map.invalidateSize(); }, 120);
  }
  const BUS_SVG = '<svg viewBox="0 0 28 16"><rect x="0" y="0" width="28" height="10" fill="#FFB300" stroke="#7A5C00"/><rect x="3" y="11.5" width="5" height="3.5" fill="#333"/><rect x="20" y="11.5" width="5" height="3.5" fill="#333"/><rect x="5" y="2.2" width="10" height="3" fill="#fff"/><rect x="18" y="2.2" width="5" height="3" fill="#fff"/></svg>';

  /* ================= 渲染：預報卡 + 狀態列 + 巴士定位 ================= */
  let lastRender = 0, tick = null;
  function render() {
    const { markers, chips } = buildModel(snapshot);
    const gpsBuses = markers.slice().sort((a, b) => a.nextSec - b.nextSec);
    const schedNext = (chips.filter(c => !c.live).sort((a, b) => a.sec - b.sec))[0];
    const cardList = [
      gpsBuses[0] && { id: gpsBuses[0].id, sec: gpsBuses[0].nextSec, gps: true, idx: gpsBuses[0].nextIdx },
      gpsBuses[1] && { id: gpsBuses[1].id, sec: gpsBuses[1].nextSec, gps: true, idx: gpsBuses[1].nextIdx },
      schedNext && { id: '—', sec: schedNext.sec, gps: false, idx: schedNext.idx },
    ].filter(Boolean).slice(0, 3);
    const labels = ['下一班', '再下一班', '第三班'];
    $('cards').innerHTML = cardList.map((c, i) =>
      '<div class="card">'
      + '<div class="lab">' + labels[i] + '<span class="gps' + (c.gps ? '' : ' off') + '">' + (c.gps ? 'GPS' : '無GPS') + '</span></div>'
      + '<div class="big" data-sec="' + c.sec + '">' + minsOf(c.sec) + '</div>'
      + '<div class="sub">' + Math.max(0, STOPS.length - 1 - c.idx) + ' 站後到終點</div>'
      + '</div>').join('');
    const lead = gpsBuses[0];
    $('status').innerHTML = lead
      ? '<span class="dot"></span>巴士 <b>' + escapeHtml(String(lead.id)) + '</b> · 實時資料<span class="gps">GPS</span>· 已離開 <b>' + escapeHtml(STOPS[Math.max(0, Math.min(STOPS.length - 1, Math.floor(lead.pos)))].name) + '</b>，前往 <b>' + escapeHtml(lead.nextName) + '</b>'
      : '<span class="dot"></span>暫無實時班次（非服務時間）';
    if (map) {
      markers.forEach(m => {
        const key = 'b' + m.id;
        let mk = busMarkers[key];
        if (!mk) {
          mk = L.marker(pointAtPos(m.pos), { icon: L.divIcon({ className: '', html: BUS_SVG, iconSize: [28, 16], iconAnchor: [14, 8] }) }).addTo(map);
          busMarkers[key] = mk;
        }
        mk.dataset_ref = m.pos; mk.dataset_gap = m.gap; mk.dataset_stop = m.nextIdx - 1;
        mk.setLatLng(pointAtPos(m.pos));
        mk.bindTooltip('巴士 ' + m.id + ' · 下一站 ' + m.nextName + ' · ' + mmss(m.nextSec) + ' 後到達', { direction: 'top', offset: [0, -10] });
      });
      const keep = new Set(markers.map(m => 'b' + m.id));
      Object.keys(busMarkers).forEach(k => { if (!keep.has(k)) { map.removeLayer(busMarkers[k]); delete busMarkers[k]; } });
    }
    lastRender = Date.now();
    clearInterval(tick);
    tick = setInterval(() => {
      const elS = (Date.now() - lastRender) / 1000;
      document.querySelectorAll('.card .big[data-sec]').forEach(ch => {
        ch.textContent = minsOf(Math.max(0, parseInt(ch.dataset.sec, 10) - elS));
      });
      Object.keys(busMarkers).forEach(k => {
        const mk = busMarkers[k];
        const ref = parseFloat(mk.dataset_ref || '0');
        const gap = parseFloat(mk.dataset_gap || '60');
        const stopNo = parseFloat(mk.dataset_stop || '0');
        if (!isFinite(ref)) return;
        const pos = Math.min(ref + elS / gap, stopNo + 0.98);
        mk.setLatLng(pointAtPos(pos));
      });
    }, 1000);
  }

  async function refreshLive() {
    const url = 'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule';
    const tries = ['https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url),
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)];
    for (const u of tries) {
      try {
        const r = await fetch(u, { signal: AbortSignal.timeout(8000) });
        if (!r.ok) continue;
        const j = await r.json();
        if (j && Array.isArray(j.busStop) && j.busStop.length) {
          snapshot = { at: new Date().toISOString().slice(0, 16).replace('T', ' '), stops: j.busStop.map(st => ({
            id: (st.busStopId || '').replace(/^K75P-/, ''),
            bus: (st.bus || []).map(b => ({
              id: String(b.busId || '?'), sec: parseInt(b.arrivalTimeInSecond, 10) || 0,
              sched: b.isScheduled === '1' || b.isScheduled === 1,
              la: (b.busLocation && Number(b.busLocation.latitude)) || 0,
              ln: (b.busLocation && Number(b.busLocation.longitude)) || 0,
            })),
          })) };
          $('mapLive').textContent = '● 實時 · ' + snapshot.at.slice(5, 16);
          render();
          return;
        }
      } catch (e) {}
    }
    $('mapLive').textContent = '● 快照 ' + snapshot.at.slice(5, 16);
  }

  initMap();
  render();
  $('mapLive').textContent = '● 快照 ' + snapshot.at.slice(5, 16);
  setInterval(refreshLive, 30000);
})();
</script>
</body>
